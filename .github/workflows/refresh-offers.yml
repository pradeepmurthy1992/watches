name: Refresh watch offers

on:
  schedule:
    - cron: "30 1 * * *"   # every day, 07:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape catalogues
        run: python scripts/scrape_offers.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/deals.json)" ]; then
            git config user.name "offers-bot"
            git config user.email "offers-bot@users.noreply.github.com"
            git add data/deals.json
            git commit -m "Refresh offers data"
            git push
          fi
